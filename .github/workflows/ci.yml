name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm test
      - run: pnpm build && node dist/main.js --version

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false # this job does not install pnpm
      - name: Plugin version matches package.json
        run: test "$(node -p "require('./package.json').version")" = "$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
      - run: npx -y @anthropic-ai/claude-code plugin validate --strict .
      - run: npx -y @anthropic-ai/claude-code plugin validate --strict plugin

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pdev --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
